<svg width="500" height="500" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>KODBE Travel &amp; Tours — Logo</title>
  <desc>Logo circulaire officiel KODBE Travel &amp; Tours</desc>

  <defs>
    <clipPath id="globeInner">
      <circle cx="340" cy="248" r="108"/>
    </clipPath>
    <linearGradient id="globeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e9fb5"/>
      <stop offset="100%" stop-color="#0b7fa0"/>
    </linearGradient>
  </defs>

  <!-- Outer navy ring -->
  <circle cx="340" cy="340" r="310" fill="#0d2260"/>
  <!-- White fill -->
  <circle cx="340" cy="340" r="298" fill="white"/>
  <!-- Inner border -->
  <circle cx="340" cy="340" r="280" fill="white" stroke="#0d2260" stroke-width="2.5"/>
  <circle cx="340" cy="340" r="270" fill="none" stroke="#0d2260" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Globe -->
  <circle cx="340" cy="248" r="108" fill="url(#globeFill)"/>

  <!-- Globe grid -->
  <g clip-path="url(#globeInner)" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.4">
    <line x1="232" y1="248" x2="448" y2="248"/>
    <line x1="235" y1="220" x2="445" y2="220"/>
    <line x1="235" y1="276" x2="445" y2="276"/>
    <line x1="244" y1="192" x2="436" y2="192"/>
    <line x1="244" y1="304" x2="436" y2="304"/>
    <line x1="262" y1="166" x2="418" y2="166"/>
    <line x1="262" y1="330" x2="418" y2="330"/>
    <ellipse cx="340" cy="248" rx="108" ry="108"/>
    <ellipse cx="340" cy="248" rx="56" ry="108"/>
    <ellipse cx="340" cy="248" rx="22" ry="108"/>
    <ellipse cx="340" cy="248" rx="86" ry="108"/>
  </g>

  <!-- Continent shapes -->
  <g clip-path="url(#globeInner)" fill="white" fill-opacity="0.14">
    <ellipse cx="318" cy="228" rx="28" ry="18"/>
    <ellipse cx="362" cy="222" rx="18" ry="12"/>
    <ellipse cx="345" cy="258" rx="22" ry="14"/>
    <ellipse cx="290" cy="248" rx="14" ry="10"/>
    <ellipse cx="385" cy="245" rx="16" ry="10"/>
    <ellipse cx="330" cy="200" rx="12" ry="8"/>
    <ellipse cx="370" cy="275" rx="10" ry="7"/>
  </g>

  <!-- Globe gloss -->
  <ellipse cx="310" cy="216" rx="30" ry="20" fill="white" fill-opacity="0.12"/>

  <!-- Orbit ellipse -->
  <ellipse cx="340" cy="248" rx="140" ry="40" fill="none" stroke="#0d2260" stroke-width="3.5" transform="rotate(-22, 340, 248)"/>

  <!-- Airplane -->
  <g transform="translate(437, 178) rotate(55)">
    <ellipse cx="0" cy="0" rx="18" ry="5.5" fill="#0d2260"/>
    <path d="M 18 0 Q 28 0 31 1.5 Q 28 3 18 3 Z" fill="#0d2260"/>
    <path d="M -1 -5.5 L 11 -20 L 16 -19 L 6 -5.5 Z" fill="#0d2260"/>
    <path d="M -1 5.5 L 11 20 L 16 19 L 6 5.5 Z" fill="#0d2260"/>
    <path d="M -11 -5.5 L -6 -14 L -3 -13 L -6 -5.5 Z" fill="#0d2260"/>
    <path d="M -11 5.5 L -6 14 L -3 13 L -6 5.5 Z" fill="#0d2260"/>
    <ellipse cx="5" cy="-10" rx="6" ry="2.8" fill="#1a4bba"/>
    <ellipse cx="5" cy="10" rx="6" ry="2.8" fill="#1a4bba"/>
  </g>

  <!-- KODBE -->
  <text x="340" y="408" font-family="Montserrat,'Arial Black',Arial,sans-serif" font-weight="900" font-size="72" fill="#0d2260" text-anchor="middle" letter-spacing="6">KODBE</text>

  <!-- Separator -->
  <rect x="210" y="420" width="260" height="3" rx="1.5" fill="#0d2260"/>

  <!-- TRAVEL &amp; TOURS -->
  <text x="340" y="456" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="18" fill="#0d2260" text-anchor="middle" letter-spacing="5">TRAVEL &amp; TOURS</text>

  <!-- Tagline -->
  <text x="340" y="488" font-family="Montserrat,Arial,sans-serif" font-weight="400" font-size="10.5" fill="#0891b2" text-anchor="middle" letter-spacing="3.5">EXPLORE. DISCOVER. JOURNEY.</text>

  <!-- Dots -->
  <g fill="#0d2260" opacity="0.35">
    <circle cx="308" cy="516" r="3"/>
    <circle cx="322" cy="519" r="2.5"/>
    <circle cx="340" cy="521" r="3.5"/>
    <circle cx="358" cy="519" r="2.5"/>
    <circle cx="372" cy="516" r="3"/>
  </g>

  <!-- Final border -->
  <circle cx="340" cy="340" r="310" fill="none" stroke="#0d2260" stroke-width="6"/>
  <circle cx="340" cy="340" r="302" fill="none" stroke="#0d2260" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
